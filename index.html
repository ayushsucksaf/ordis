<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>ORDIS • Mobile IDE</title>
  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }
    body {
      margin: 0;
      padding: 0;
      font-family: 'JetBrains Mono', Consolas, Monaco, monospace;
      background: #0d0d0d;
      color: #e6e6e6;
      height: 100dvh;
      width: 100vw;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      user-select: none;
    }
    button, input, select, textarea {
      font-family: 'JetBrains Mono', Consolas, Monaco, monospace;
      outline: none;
    }
    header {
      height: 44px;
      background: #141414;
      border-bottom: 1px solid #262626;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 8px;
      flex-shrink: 0;
    }
    .btn {
      background: #202020;
      color: #fff;
      border: 1px solid #3a3a3a;
      padding: 4px 8px;
      font-size: 12px;
      cursor: pointer;
    }
    .btn:active {
      background: #333;
    }
    .btn-white {
      background: #fff;
      color: #000;
      border: 1px solid #fff;
      font-weight: bold;
    }
    .btn-white:active {
      background: #ccc;
    }
    .btn-danger {
      background: #2a1515;
      color: #ff8888;
      border: 1px solid #4a2020;
      font-weight: bold;
    }
    #workspace {
      flex: 1;
      display: flex;
      position: relative;
      overflow: hidden;
    }
    #filesDrawer {
      position: absolute;
      top: 0;
      left: 0;
      bottom: 0;
      width: 260px;
      background: #121212;
      border-right: 1px solid #282828;
      z-index: 50;
      display: none;
      flex-direction: column;
      box-shadow: 4px 0 16px rgba(0,0,0,0.6);
    }
    #editorContainer {
      flex: 1;
      display: flex;
      flex-direction: column;
      background: #0a0a0a;
      overflow: hidden;
    }
    #editorBody {
      flex: 1;
      display: flex;
      overflow: hidden;
      position: relative;
    }
    #lineGutter {
      width: 36px;
      background: #0d0d0d;
      border-right: 1px solid #1f1f1f;
      color: #444444;
      font-size: 13px;
      line-height: 20px;
      text-align: right;
      padding: 8px 6px 8px 0;
      overflow: hidden;
    }
    #codeEditor {
      flex: 1;
      background: transparent;
      color: #f0f0f0;
      border: none;
      resize: none;
      font-size: 13px;
      line-height: 20px;
      padding: 8px;
      tab-size: 4;
      white-space: pre;
      overflow: auto;
    }
    #mobileKeys {
      height: 30px;
      background: #111;
      border-top: 1px solid #222;
      display: flex;
      align-items: center;
      overflow-x: auto;
      padding: 0 4px;
      gap: 2px;
      flex-shrink: 0;
      white-space: nowrap;
    }
    #bottomDock {
      height: 38dvh;
      background: #121212;
      border-top: 1px solid #2a2a2a;
      display: none;
      flex-direction: column;
      flex-shrink: 0;
      z-index: 40;
    }
    .dock-tab-btn {
      background: transparent;
      color: #888;
      border: 1px solid transparent;
      padding: 4px 8px;
      font-size: 11px;
      cursor: pointer;
    }
    .dock-tab-btn.active {
      background: #333;
      color: #fff;
      border-color: #555;
    }
    pre.output-box {
      margin: 0;
      background: #050505;
      color: #e0e0e0;
      border: 1px solid #222;
      padding: 8px;
      font-size: 11px;
      line-height: 16px;
      overflow: auto;
      white-space: pre-wrap;
      word-break: break-all;
    }
  </style>
</head>
<body>

  <!-- Top Bar -->
  <header>
    <div style="display:flex; align-items:center; gap:8px;">
      <button class="btn" onclick="toggleFilesDrawer()">[FILES]</button>
      <span style="font-weight:bold; letter-spacing:1px; font-size:13px;">ORDIS</span>
    </div>
    <div style="font-size:12px; color:#aaa; max-width:35%; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;">
      <span id="activeFileTitle">main.py</span><span id="dirtyIndicator" style="display:none; color:#fff;">*</span>
    </div>
    <div style="display:flex; align-items:center; gap:6px;">
      <button class="btn" id="saveBtn" onclick="saveFile()">[SAVE]</button>
      <button class="btn btn-white" id="runBtn" onclick="runCode()">[RUN]</button>
    </div>
  </header>

  <!-- Main Workspace -->
  <div id="workspace">
    <!-- Files Drawer -->
    <div id="filesDrawer">
      <div style="padding:8px; border-bottom:1px solid #222; display:flex; justify-content:space-between; align-items:center;">
        <span style="font-size:11px; font-weight:bold; color:#888; letter-spacing:1px;">WORKSPACE FILES</span>
        <button class="btn" onclick="toggleFilesDrawer(false)" style="padding:2px 6px; border:none; background:transparent;">[X]</button>
      </div>
      <div style="padding:8px; border-bottom:1px solid #222; font-size:11px;">
        <div style="color:#777; margin-bottom:4px;" id="drawerSessionDisplay">SESSION: none</div>
        <div style="display:flex; gap:4px;">
          <button class="btn" style="flex:1; font-size:11px;" onclick="createSession()">+ NEW SESSION</button>
          <button class="btn" style="font-size:11px;" onclick="refreshFiles()">REFRESH</button>
        </div>
      </div>
      <div style="padding:8px; border-bottom:1px solid #222; display:flex; gap:4px;">
        <input id="newFileInput" placeholder="new_file.py" style="flex:1; background:#080808; color:#fff; border:1px solid #333; padding:4px 6px; font-size:11px;" onkeydown="if(event.key==='Enter') createNewFile()" />
        <button class="btn" onclick="createNewFile()">+</button>
      </div>
      <div id="fileListContainer" style="flex:1; overflow-y:auto; padding:4px 0;"></div>
    </div>

    <!-- Code Editor Container -->
    <div id="editorContainer">
      <div id="editorBody">
        <div id="lineGutter">1</div>
        <textarea id="codeEditor" spellcheck="false"># ordis mobile ide
print("hello world")
</textarea>
      </div>

      <!-- Mobile helper keyboard bar -->
      <div id="mobileKeys"></div>
    </div>
  </div>

  <!-- Bottom Dock Panel -->
  <div id="bottomDock">
    <div style="height:30px; background:#171717; border-bottom:1px solid #222; display:flex; align-items:center; justify-content:space-between; padding:0 8px; font-size:11px;">
      <span id="dockTitle" style="font-weight:bold; color:#888;">OUTPUT</span>
      <div style="display:flex; gap:6px;">
        <button class="btn" style="padding:2px 4px; background:transparent; border:none;" onclick="toggleDockSize()">[EXPAND]</button>
        <button class="btn" style="padding:2px 4px; background:transparent; border:none;" onclick="setBottomTab('none')">[HIDE]</button>
      </div>
    </div>

    <!-- Output Tab -->
    <div id="panelOutput" style="flex:1; display:flex; flex-direction:column; padding:8px; overflow:hidden;">
      <div style="display:flex; gap:6px; margin-bottom:6px; align-items:center; flex-wrap:wrap;">
        <span style="font-size:11px; color:#888;">LANG:</span>
        <select id="language" style="background:#080808; color:#fff; border:1px solid #333; padding:3px 6px; font-size:11px;">
          <option value="python3">python3</option>
          <option value="cpp">cpp (clang++)</option>
          <option value="javascript">javascript (node)</option>
        </select>
        <input id="stdin" placeholder="stdin (optional)..." style="flex:1; min-width:100px; background:#080808; color:#fff; border:1px solid #333; padding:3px 6px; font-size:11px;" />
        <button class="btn btn-white" onclick="runCode()">RUN</button>
      </div>
      <pre id="runOutput" class="output-box" style="flex:1;">(Click [RUN] to execute code)</pre>
    </div>

    <!-- Terminal Tab -->
    <div id="panelTerminal" style="flex:1; display:none; flex-direction:column; padding:8px; overflow:hidden;">
      <div style="display:flex; gap:4px; margin-bottom:6px; overflow-x:auto; white-space:nowrap;">
        <button class="btn" id="termToggleBtn" onclick="toggleTerminal()">[CONNECT]</button>
        <button class="btn" onclick="sendQuickCommand('ls -la')">ls -la</button>
        <button class="btn" onclick="sendQuickCommand('pwd')">pwd</button>
        <button class="btn" onclick="sendQuickCommand('git status')">git status</button>
        <button class="btn" onclick="sendQuickCommand('python3 ' + activeFile)">python3 file</button>
        <button class="btn" onclick="sendQuickCommand('clear')">clear</button>
        <button class="btn btn-danger" onclick="sendCtrlC()">Ctrl+C</button>
      </div>
      <pre id="terminalLog" class="output-box" style="flex:1; background:#000; color:#d0d0d0; margin-bottom:6px;">[terminal ready - click connect or type command below]
</pre>
      <div style="display:flex; gap:4px;">
        <input id="terminalInput" placeholder="type bash command..." style="flex:1; background:#080808; color:#fff; border:1px solid #333; padding:4px 8px; font-size:12px;" onkeydown="if(event.key==='Enter') sendTerminalCommand()" />
        <button class="btn btn-white" onclick="sendTerminalCommand()">SEND</button>
      </div>
    </div>

    <!-- AI Tab -->
    <div id="panelAI" style="flex:1; display:none; flex-direction:column; padding:8px; overflow:hidden;">
      <div style="display:flex; gap:4px; margin-bottom:6px; overflow-x:auto; white-space:nowrap;">
        <button class="btn" style="font-size:10px;" onclick="setAgentPrompt('fix bugs in ' + activeFile)">fix bugs</button>
        <button class="btn" style="font-size:10px;" onclick="setAgentPrompt('add comments to ' + activeFile)">add comments</button>
        <button class="btn" style="font-size:10px;" onclick="setAgentPrompt('write unit test for ' + activeFile)">write tests</button>
      </div>
      <div style="display:flex; gap:4px; margin-bottom:6px;">
        <input id="agentPrompt" placeholder="Ask agent to write or edit code..." value="fix any bugs in main.py" style="flex:1; background:#080808; color:#fff; border:1px solid #333; padding:4px 8px; font-size:12px;" onkeydown="if(event.key==='Enter') sendToAgent()" />
        <button class="btn" onclick="useMic()">MIC</button>
        <button class="btn btn-white" id="agentSendBtn" onclick="sendToAgent()">ASK</button>
      </div>
      <div id="voiceStatus" style="font-size:10px; color:#888; margin-bottom:4px;"></div>
      <pre id="agentReply" class="output-box" style="flex:1;">(Agent responses and file edit summaries will appear here)</pre>
    </div>
  </div>

  <!-- Bottom Dock Bar -->
  <footer style="height:36px; background:#141414; border-top:1px solid #262626; display:flex; align-items:center; justify-content:space-between; padding:0 6px; flex-shrink:0;">
    <div style="display:flex; gap:4px;">
      <button id="tabBtnOutput" class="dock-tab-btn" onclick="toggleBottomTab('output')">[OUTPUT]</button>
      <button id="tabBtnTerminal" class="dock-tab-btn" onclick="toggleBottomTab('terminal')">[TERMINAL]</button>
      <button id="tabBtnAI" class="dock-tab-btn" onclick="toggleBottomTab('ai')">[AI AGENT]</button>
    </div>
    <div id="footerStatus" style="font-size:10px; color:#666;">READY</div>
  </footer>

  <script>
    const host = window.location.hostname || "localhost";
    const protocol = window.location.protocol.startsWith("http") ? window.location.protocol : "http:";
    const API_BASE = `${protocol}//${host}:8000`;
    const WS_BASE = API_BASE.replace(/^http/, "ws");

    let sessionId = null;
    let activeFile = "main.py";
    let savedContent = "";
    let terminalSocket = null;
    let currentBottomTab = "none";
    let isLargeDock = false;

    function cleanAnsi(text) {
      return text
        .replace(/\x1b\[[0-9;?]*[a-zA-Z]/g, "")
        .replace(/\x1b\].*?(\x07|\x1b\\)/g, "")
        .replace(/\x1b[PX^_].*?\x1b\\/g, "")
        .replace(/[\x00-\x08\x0B\x0C\x0E-\x1A\x1C-\x1F]/g, "");
    }

    function updateLineNumbers() {
      const code = document.getElementById("codeEditor").value;
      const count = Math.max(code.split("\n").length, 1);
      let linesHtml = "";
      for (let i = 1; i <= count; i++) {
        linesHtml += `<div style="height:20px;">${i}</div>`;
      }
      document.getElementById("lineGutter").innerHTML = linesHtml;

      const isDirty = code !== savedContent;
      document.getElementById("dirtyIndicator").style.display = isDirty ? "inline" : "none";
      document.getElementById("saveBtn").className = isDirty ? "btn btn-white" : "btn";
    }

    function toggleFilesDrawer(force) {
      const drawer = document.getElementById("filesDrawer");
      const isVisible = drawer.style.display === "flex";
      const next = force !== undefined ? force : !isVisible;
      drawer.style.display = next ? "flex" : "none";
    }

    function setBottomTab(tab) {
      currentBottomTab = tab;
      const dock = document.getElementById("bottomDock");
      const pOut = document.getElementById("panelOutput");
      const pTerm = document.getElementById("panelTerminal");
      const pAI = document.getElementById("panelAI");
      const tOut = document.getElementById("tabBtnOutput");
      const tTerm = document.getElementById("tabBtnTerminal");
      const tAI = document.getElementById("tabBtnAI");

      [tOut, tTerm, tAI].forEach(b => b.classList.remove("active"));
      [pOut, pTerm, pAI].forEach(p => p.style.display = "none");

      if (tab === "none") {
        dock.style.display = "none";
        return;
      }

      dock.style.display = "flex";
      if (tab === "output") {
        pOut.style.display = "flex";
        tOut.classList.add("active");
        document.getElementById("dockTitle").innerText = "CODE EXECUTION OUTPUT";
      } else if (tab === "terminal") {
        pTerm.style.display = "flex";
        tTerm.classList.add("active");
        document.getElementById("dockTitle").innerText = "BASH SHELL (PTY)";
        if (!terminalSocket || terminalSocket.readyState !== WebSocket.OPEN) {
          toggleTerminal();
        }
      } else if (tab === "ai") {
        pAI.style.display = "flex";
        tAI.classList.add("active");
        document.getElementById("dockTitle").innerText = "AI AGENT ASSISTANT";
      }
    }

    function toggleBottomTab(tab) {
      if (currentBottomTab === tab) {
        setBottomTab("none");
      } else {
        setBottomTab(tab);
      }
    }

    function toggleDockSize() {
      isLargeDock = !isLargeDock;
      document.getElementById("bottomDock").style.height = isLargeDock ? "65dvh" : "38dvh";
    }

    function setStatus(msg) {
      document.getElementById("footerStatus").innerText = msg;
    }

    function detectLanguage(fn) {
      const ext = fn.split(".").pop().toLowerCase();
      if (ext === "py") return "python3";
      if (ext === "cpp" || ext === "cc" || ext === "cxx" || ext === "c") return "cpp";
      if (ext === "js" || ext === "ts" || ext === "mjs") return "javascript";
      return "python3";
    }

    // Init session
    async function createSession() {
      try {
        if (terminalSocket) terminalSocket.close();
        const res = await fetch(`${API_BASE}/session/create`, { method: "POST" });
        const data = await res.json();
        sessionId = data.session_id;
        document.getElementById("drawerSessionDisplay").innerText = "SESSION: " + sessionId.slice(0, 8);

        const initial = '# ordis mobile ide\nprint("hello world")\n';
        await fetch(`${API_BASE}/files/write`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ session_id: sessionId, path: "main.py", content: initial }),
        });

        activeFile = "main.py";
        document.getElementById("activeFileTitle").innerText = "main.py";
        document.getElementById("codeEditor").value = initial;
        savedContent = initial;
        updateLineNumbers();
        await refreshFiles();
        setStatus("Session ready");
        toggleFilesDrawer(false);
      } catch (err) {
        setStatus("Error: " + err.message);
      }
    }

    async function refreshFiles() {
      if (!sessionId) return;
      try {
        const res = await fetch(`${API_BASE}/files/list?session_id=${sessionId}`);
        const data = await res.json();
        const list = data.files && data.files.length ? data.files : ["main.py"];
        const container = document.getElementById("fileListContainer");
        container.innerHTML = "";
        list.forEach(f => {
          const item = document.createElement("div");
          const isSelected = f === activeFile;
          item.style.padding = "6px 12px";
          item.style.fontSize = "12px";
          item.style.cursor = "pointer";
          item.style.background = isSelected ? "#242424" : "transparent";
          item.style.color = isSelected ? "#ffffff" : "#aaaaaa";
          item.style.borderLeft = isSelected ? "2px solid #ffffff" : "2px solid transparent";
          item.innerText = f;
          item.onclick = () => loadFile(f);
          container.appendChild(item);
        });
      } catch (e) {
        console.error(e);
      }
    }

    async function loadFile(f) {
      if (!sessionId) return;
      setStatus("Loading " + f + "...");
      try {
        const res = await fetch(`${API_BASE}/files/read?session_id=${sessionId}&path=${encodeURIComponent(f)}`);
        const data = await res.json();
        activeFile = f;
        document.getElementById("activeFileTitle").innerText = f;
        document.getElementById("codeEditor").value = data.content ?? "";
        savedContent = data.content ?? "";
        document.getElementById("language").value = detectLanguage(f);
        updateLineNumbers();
        setStatus("Loaded " + f);
        toggleFilesDrawer(false);
        refreshFiles();
      } catch (e) {
        setStatus("Error: " + e.message);
      }
    }

    async function saveFile() {
      if (!sessionId) return;
      const content = document.getElementById("codeEditor").value;
      setStatus("Saving " + activeFile + "...");
      try {
        await fetch(`${API_BASE}/files/write`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ session_id: sessionId, path: activeFile, content: content }),
        });
        savedContent = content;
        updateLineNumbers();
        setStatus("Saved " + activeFile);
        refreshFiles();
      } catch (e) {
        setStatus("Error saving: " + e.message);
      }
    }

    async function createNewFile() {
      if (!sessionId) return;
      const input = document.getElementById("newFileInput");
      const name = input.value.trim();
      if (!name) return;
      const initial = name.endsWith(".cpp") ? '#include <iostream>\nint main(){ std::cout << "Hello" << std::endl; }\n' : '# Python\nprint("Hello")\n';
      await fetch(`${API_BASE}/files/write`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ session_id: sessionId, path: name, content: initial }),
      });
      input.value = "";
      await refreshFiles();
      await loadFile(name);
    }

    async function runCode() {
      if (!sessionId) return;
      await saveFile();
      setBottomTab("output");
      const lang = document.getElementById("language").value;
      const stdin = document.getElementById("stdin").value;
      const out = document.getElementById("runOutput");
      out.innerText = `Running ${activeFile} (${lang})...`;
      setStatus(`Running ${activeFile}...`);
      try {
        const res = await fetch(`${API_BASE}/code/run`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ session_id: sessionId, filename: activeFile, language: lang, stdin: stdin }),
        });
        const data = await res.json();
        out.innerText = JSON.stringify(data, null, 2);
        setStatus("Execution finished");
      } catch (e) {
        out.innerText = "Error: " + e.message;
        setStatus("Execution error");
      }
    }

    function setAgentPrompt(p) {
      document.getElementById("agentPrompt").value = p;
    }

    async function sendToAgent() {
      if (!sessionId) return;
      const prompt = document.getElementById("agentPrompt").value.trim();
      if (!prompt) return;
      setBottomTab("ai");
      const replyEl = document.getElementById("agentReply");
      replyEl.innerText = "Agent is processing and modifying files...";
      setStatus("Agent thinking...");
      try {
        const res = await fetch(`${API_BASE}/agent/chat`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ session_id: sessionId, message: prompt }),
        });
        const data = await res.json();
        replyEl.innerText = data.reply || data.error || "Done";
        await refreshFiles();
        await loadFile(activeFile);
        setStatus("Agent finished");
      } catch (e) {
        replyEl.innerText = "Agent error: " + e.message;
        setStatus("Agent error");
      }
    }

    async function useMic() {
      const el = document.getElementById("voiceStatus");
      el.innerText = "Listening via Termux microphone...";
      try {
        const res = await fetch(`${API_BASE}/voice/transcribe`, { method: "POST" });
        const data = await res.json();
        if (data.error) {
          el.innerText = data.error;
        } else if (data.text) {
          document.getElementById("agentPrompt").value = data.text;
          el.innerText = `Recognized: "${data.text}"`;
        }
      } catch (e) {
        el.innerText = "Mic error: " + e.message;
      }
    }

    function toggleTerminal() {
      if (!sessionId) return;
      const btn = document.getElementById("termToggleBtn");
      const log = document.getElementById("terminalLog");

      if (terminalSocket && terminalSocket.readyState === WebSocket.OPEN) {
        terminalSocket.close();
        btn.innerText = "[CONNECT]";
        return;
      }

      log.innerText += `[connecting to bash...]\n`;
      terminalSocket = new WebSocket(`${WS_BASE}/terminal?session_id=${sessionId}`);

      terminalSocket.onopen = () => {
        btn.innerText = "[DISCONNECT]";
        log.innerText += `[connected to bash]\n`;
      };

      terminalSocket.onmessage = (e) => {
        log.innerText += cleanAnsi(e.data);
        log.scrollTop = log.scrollHeight;
      };

      terminalSocket.onclose = () => {
        btn.innerText = "[CONNECT]";
        log.innerText += `\n[terminal disconnected]\n`;
      };
    }

    function sendTerminalCommand() {
      if (!terminalSocket || terminalSocket.readyState !== WebSocket.OPEN) {
        toggleTerminal();
        return;
      }
      const inp = document.getElementById("terminalInput");
      terminalSocket.send(inp.value + "\n");
      inp.value = "";
    }

    function sendQuickCommand(cmd) {
      if (!terminalSocket || terminalSocket.readyState !== WebSocket.OPEN) {
        toggleTerminal();
        return;
      }
      terminalSocket.send(cmd + "\n");
    }

    function sendCtrlC() {
      if (terminalSocket && terminalSocket.readyState === WebSocket.OPEN) {
        terminalSocket.send("\x03");
      }
    }

    // Keyboard keys helper
    function insertKey(k) {
      const editor = document.getElementById("codeEditor");
      const start = editor.selectionStart;
      const end = editor.selectionEnd;
      const val = editor.value;
      editor.value = val.substring(0, start) + k + val.substring(end);
      editor.selectionStart = editor.selectionEnd = start + k.length;
      editor.focus();
      updateLineNumbers();
    }

    // Init mobile keyboard keys
    const keys = ["Tab", "{", "}", "(", ")", "[", "]", ";", ":", '"', "'", "=", "+", "-", "_", ".", "/", "\\"];
    const keyContainer = document.getElementById("mobileKeys");
    keys.forEach(k => {
      const b = document.createElement("button");
      b.className = "btn";
      b.style.padding = "2px 8px";
      b.style.fontSize = "11px";
      b.style.minWidth = "24px";
      b.innerText = k;
      b.onclick = () => insertKey(k === "Tab" ? "    " : k);
      keyContainer.appendChild(b);
    });

    document.getElementById("codeEditor").addEventListener("input", updateLineNumbers);
    document.getElementById("codeEditor").addEventListener("keydown", function(e) {
      if (e.key === "Tab") {
        e.preventDefault();
        insertKey("    ");
      }
    });

    window.addEventListener("DOMContentLoaded", () => {
      createSession();
    });
